<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - Grifa Shop</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #1a1a1a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; }
        .back-btn { color: white; text-decoration: none; font-size: 14px; background: #333; padding: 8px 12px; border-radius: 5px; }
        .container { padding: 20px; max-width: 500px; margin: auto; background: white; border-radius: 10px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; box-sizing: border-box; 
        }
        .submit-btn { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .order-summary { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; border: 1px dashed #ccc; }
    </style>
</head>
<body>
    <header>
        <h1>إتمام الطلب</h1>
        <a href="cart.html" class="back-btn">رجوع للسلة</a>
    </header>

    <div class="container">
        <div class="order-summary">
            <h3>الدفع عند الاستلام (COD)</h3>
            <p>المجموع الكلي: <strong id="checkout-total" style="color: #e74c3c; font-size: 20px;">0</strong> دج</p>
        </div>

        <form id="checkout-form">
            <div class="form-group">
                <label>الاسم واللقب</label>
                <input type="text" id="fullname" required placeholder="مثال: محمد بن علي">
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="phone" required placeholder="مثال: 0550123456" pattern="[0-9]{10}">
            </div>

            <div class="form-group">
                <label>الولاية</label>
                <select id="wilaya" required>
                    <option value="">اختر الولاية...</option>
                    <option value="16">الجزائر</option>
                    <option value="31">وهران</option>
                    <option value="25">قسنطينة</option>
                    <option value="19">سطيف</option>
                    <option value="09">البليدة</option>
                    <option value="06">بجاية</option>
                    <!-- تقدر تزيد الباقي من بعد -->
                </select>
            </div>

            <div class="form-group">
                <label>البلدية / العنوان بالتفصيل</label>
                <textarea id="address" rows="2" required placeholder="اسم البلدية والحي..."></textarea>
            </div>

            <button type="submit" class="submit-btn">تأكيد الطلب ✅</button>
        </form>
    </div>

    <script type="module" src="firebase-config.js"></script>
<script type="module" src="checkout.js"></script>
</body>
</html>
