<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - Grifa Shop</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #1a1a1a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; }
        .back-btn { color: white; text-decoration: none; font-size: 14px; background: #333; padding: 8px 12px; border-radius: 5px; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .cart-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .cart-item-info p { margin: 0; color: #e74c3c; font-weight: bold; }
        .remove-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .total-box { background: #1a1a1a; color: white; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; }
        .total-box h2 { margin: 0 0 10px 0; font-size: 20px; }
        .checkout-btn { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .empty-cart { text-align: center; padding: 50px 0; color: #777; }
    </style>
</head>
<body>
    <header>
        <h1>سلة المشتريات</h1>
        <a href="index.html" class="back-btn">رجوع للمتجر</a>
    </header>
    <div class="container">
        <div id="cart-items-container"></div>
        <div class="total-box" id="total-box" style="display: none;">
            <h2>المجموع الكلي: <span id="total-price">0</span> دج</h2>
            <a href="checkout.html" style="display: block; text-align: center; text-decoration: none;" class="checkout-btn">إتمام الطلب</a>
        </div>
    </div>
    <script src="cart.js"></script>
</body>
</html>
