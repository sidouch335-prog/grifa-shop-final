<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Grifa Shop</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #1a1a1a; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; }
        .back-btn { color: white; text-decoration: none; font-size: 14px; background: #333; padding: 8px 12px; border-radius: 5px; }
        .container { padding: 20px; max-width: 600px; margin: auto; background: white; border-radius: 10px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .submit-btn { background: #2980b9; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .product-list { margin-top: 30px; }
        .admin-product { display: flex; justify-content: space-between; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #eee; }
        
        /* ستايل قسم الطلبات */
        .orders-title { margin-top: 40px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .order-card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-right: 5px solid #27ae60; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .order-card h4 { margin: 0 0 10px 0; }
        .order-card p { margin: 5px 0; }
        .order-card .order-items { background: #f4f4f9; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .order-card .order-items ul { margin: 5px 0; padding-right: 20px; }
        .order-card .order-total { font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>لوحة التحكم (Admin)</h1>
        <a href="index.html" class="back-btn">العودة للمتجر</a>
    </header>

    <div class="container">
        <!-- 1. قسم إضافة المنتج -->
        <h2>إضافة منتج جديد</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="p-name" required placeholder="مثال: قميص كلاسيك">
            </div>
            <div class="form-group">
                <label>السعر (دج)</label>
                <input type="number" id="p-price" required placeholder="مثال: 2500">
            </div>
            <div class="form-group">
                <label>رابط الصورة (URL)</label>
                <input type="url" id="p-image" required placeholder="https://...">
            </div>
            <button type="submit" class="submit-btn">إضافة المنتج للمتجر</button>
        </form>

        <!-- 2. قسم عرض المنتجات (هنا فين كيتعمرو المنتجات) -->
        <div class="product-list" id="product-list"></div>

        <!-- 3. قسم الطلبات (برا قسم المنتجات باش ما يتمسحش) -->
        <h2 class="orders-title">الطلبات الواردة</h2>
        <div id="orders-container"></div>
    </div>

    <!-- ربط السحابة وملف الجافاسكريبت -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
