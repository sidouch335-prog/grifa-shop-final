<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Grifa Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; height: 100vh; overflow: hidden; }

        /* القائمة الجانبية (Sidebar) */
        .sidebar { width: 250px; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; transition: 0.3s; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .sidebar-header h2 { font-size: 24px; font-weight: 900; color: #e74c3c; }
        .sidebar-menu { flex-grow: 1; padding: 20px 0; }
        .sidebar-menu a { display: block; padding: 15px 20px; color: #ccc; text-decoration: none; transition: 0.3s; font-weight: 700; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: #333; color: white; border-right: 4px solid #e74c3c; }
        .sidebar-footer { padding: 20px; border-top: 1px solid #333; text-align: center; }
        .sidebar-footer a { color: #e74c3c; text-decoration: none; font-weight: bold; }

        /* المحتوى الرئيسي */
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-bar h1 { font-size: 28px; font-weight: 900; }
        
        /* بطاقات الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-right: 5px solid #2980b9; }
        .stat-card.green { border-right-color: #27ae60; }
        .stat-card.red { border-right-color: #e74c3c; }
        .stat-card h3 { font-size: 16px; color: #777; margin-bottom: 10px; }
        .stat-card p { font-size: 28px; font-weight: 900; color: #1a1a1a; }

        /* استمارة إضافة منتج */
        .form-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .form-card h2 { margin-bottom: 20px; font-size: 20px; font-weight: 900; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        .submit-btn { background: #1a1a1a; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #e74c3c; }

        /* جدول المنتجات والطلبات */
        .table-container { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; font-weight: bold; color: #555; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Grifa Admin</h2>
        </div>
        <div class="sidebar-menu">
            <a href="#" class="active">📊 لوحة المعلومات</a>
            <a href="#">📦 المنتجات</a>
            <a href="#">🛒 الطلبات</a>
            <a href="settings.html">⚙️ الإعدادات</a>        </div>
        <div class="sidebar-footer">
            <a href="index.html">← العودة للمتجر</a>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div class="top-bar">
            <h1>لوحة التحكم</h1>
        </div>

        <!-- إحصائيات -->
        <div class="stats-grid">
            <div class="stat-card green">
                <h3>إجمالي المبيعات</h3>
                <p id="total-sales">0 دج</p>
            </div>
            <div class="stat-card">
                <h3>الطلبات الجديدة</h3>
                <p id="total-orders">0</p>
            </div>
            <div class="stat-card red">
                <h3>المنتجات</h3>
                <p id="total-products">0</p>
            </div>
        </div>

        <!-- قسم إضافة منتج -->
        <div class="form-card">
            <h2>إضافة منتج جديد</h2>
            <form id="add-product-form">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="p-name" required placeholder="مثال: قميص كلاسيك">
                </div>
                <div class="form-group">
                    <label>السعر (دج)</label>
                    <input type="number" id="p-price" required placeholder="مثال: 2500">
                </div>
                                <div class="form-group">
                    <label>صورة المنتج</label>
                    <input type="file" id="p-image-file" accept="image/*" required style="padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%;">
                    <input type="hidden" id="p-image">
                </div>
                
                <!-- خانة النوع اللي زدنا -->
                <div class="form-group">
                    <label>نوع المنتج</label>
                    <select id="p-type" required>
                        <option value="shirt">قميص</option>
                        <option value="pants">سروال</option>
                        <option value="shoes">حذاء</option>
                        <option value="accessory">إكسسوار</option>
                    </select>
                </div>

                <!-- الزر في بلاصتو الصحيحة في الأخير -->
                <button type="submit" class="submit-btn">إضافة المنتج للمتجر</button>
            </form>
        </div>

        <!-- قائمة المنتجات -->
        <h2 style="margin-bottom: 20px;">المنتجات الحالية</h2>
        <div class="table-container">
            <table id="products-table">
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>السعر</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- هنا راح تطلع المنتجات -->
                </tbody>
            </table>
        </div>

        <!-- جدول الطلبات -->
        <h2 style="margin-bottom: 20px;">الطلبات الواردة</h2>
        <div class="table-container">
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>العنوان</th>
                        <th>المنتجات</th>
                        <th>المجموع</th>
                        <th>الحالة</th>
                       <th>تغيير الحالة</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- هنا راح تطلع الطلبات -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ربط الملفات -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
