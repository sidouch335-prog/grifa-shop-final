<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - Grifa Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس الهوية البصرية ديال الداشبورد */
        :root {
            --primary: #6B46C1;
            --primary-light: #9F7AEA;
            --primary-gradient: linear-gradient(135deg, #6B46C1 0%, #9F7AEA 100%);
            --bg-color: #F3F4F6;
            --white: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --border-color: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

        /* القائمة الجانبية */
        .sidebar {
            width: 260px; background-color: var(--white); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: all 0.3s ease; z-index: 100;
        }
        .sidebar-header { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { font-size: 22px; font-weight: 900; color: var(--primary); }
        .sidebar-menu { flex-grow: 1; padding: 20px 10px; overflow-y: auto; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--text-light); text-decoration: none; font-weight: 600;
            border-radius: 10px; margin-bottom: 5px; transition: all 0.2s;
        }
        .menu-item:hover, .menu-item.active { background-color: #F3E8FF; color: var(--primary); }
        .menu-item i { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); }

        /* المحتوى الرئيسي */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }

        .top-bar {
            background-color: var(--white); padding: 15px 30px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 50;
        }
        .top-bar h1 { font-size: 20px; font-weight: 700; }

        .dashboard-container { padding: 30px; display: flex; flex-direction: column; gap: 30px; }

        /* استمارة إضافة منتج */
        .form-card { background: var(--white); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .form-card h2 { font-size: 20px; font-weight: 900; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-dark); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; }
        .submit-btn { background: var(--primary-gradient); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(107, 70, 193, 0.3); }
        
        /* أزرار المتغيرات */
        .variant-select-btn { padding: 8px 15px; border: 2px solid var(--border-color); background: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .variant-select-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }

        /* الجداول */
        .table-container { background: var(--white); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border-color); }
        th { background: #F9FAFB; color: var(--text-light); font-weight: 600; }
        td { font-size: 14px; }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Grifa<span style="color: var(--text-dark)">Shop</span></h2>
        </div>
        <div class="sidebar-menu">
            <a href="admin.html" class="menu-item"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="products.html" class="menu-item active"><i class="fas fa-box"></i> المنتجات</a>
            <a href="orders.html" class="menu-item"><i class="fas fa-shopping-cart"></i> الطلبات</a>
            <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> الإعدادات</a>
            <a href="customers.html" class="menu-item"><i class="fas fa-users"></i> العملاء</a>
        </div>
        <div class="sidebar-footer">
            <a href="index.html" class="menu-item" style="justify-content: center;"><i class="fas fa-arrow-left"></i> العودة للمتجر</a>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <header class="top-bar">
            <h1>إدارة المنتجات</h1>
        </header>

        <div class="dashboard-container">
            
            <!-- استمارة إضافة منتج -->
            <div class="form-card">
                <h2>إضافة منتج جديد</h2>
                <form id="add-product-form">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="p-name" required placeholder="مثال: قميص كلاسيك">
                    </div>
                    <div class="form-group">
                        <label>السعر (دج)</label>
                        <input type="number" id="p-price" required placeholder="مثال: 2500">
                    </div>
                    <div class="form-group">
                        <label>صورة المنتج</label>
                        <input type="file" id="p-image-file" accept="image/*" required style="padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%;">
                        <input type="hidden" id="p-image">
                    </div>
                                        <div class="form-group">
                        <label>نوع المنتج</label>
                        <select id="p-type" required onchange="toggleVariants()">
                            <option value="shirt">قميص</option>
                            <option value="pants">سروال</option>
                            <option value="shoes">حذاء</option>
                            <option value="accessory">إكسسوار</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>واش المنتج فيه مقاسات وألوان؟</label>
                        <select id="has-variants" onchange="toggleVariants()">
                            <option value="no">لا، منتج عادي (مقاس واحد)</option>
                            <option value="yes">نعم، فيه مقاسات وألوان</option>
                        </select>
                    </div>
                    <div class="form-group" id="single-stock-group">
                        <label>الكمية المتوفرة</label>
                        <input type="number" id="p-stock" placeholder="مثال: 10" min="0" value="10">
                    </div>
                    <div id="variants-container" style="display: none; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                        <h3 style="margin-bottom: 10px; font-size: 16px;">المتغيرات (اختر المتوفر)</h3>
                                                                      <div class="form-group">
                            <label>المقاسات المتوفرة</label>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;" id="size-buttons">
                                <!-- مقاسات الملابس -->
                                <button type="button" class="variant-select-btn size-shirt" onclick="toggleSelection(this, 'size', 'S')">S</button>
                                <button type="button" class="variant-select-btn size-shirt" onclick="toggleSelection(this, 'size', 'M')">M</button>
                                <button type="button" class="variant-select-btn size-shirt" onclick="toggleSelection(this, 'size', 'L')">L</button>
                                <button type="button" class="variant-select-btn size-shirt" onclick="toggleSelection(this, 'size', 'XL')">XL</button>
                                <button type="button" class="variant-select-btn size-shirt" onclick="toggleSelection(this, 'size', 'XXL')">XXL</button>
                                <!-- مقاسات الأحذية -->
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '38')">38</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '39')">39</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '40')">40</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '41')">41</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '42')">42</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '43')">43</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '44')">44</button>
                                <button type="button" class="variant-select-btn size-shoes" onclick="toggleSelection(this, 'size', '45')">45</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>الألوان المتوفرة</label>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button type="button" class="variant-select-btn" onclick="toggleSelection(this, 'color', 'أحمر')">أحمر</button>
                                <button type="button" class="variant-select-btn" onclick="toggleSelection(this, 'color', 'أزرق')">أزرق</button>
                                <button type="button" class="variant-select-btn" onclick="toggleSelection(this, 'color', 'أسود')">أسود</button>
                                <button type="button" class="variant-select-btn" onclick="toggleSelection(this, 'color', 'أبيض')">أبيض</button>
                                <button type="button" class="variant-select-btn" onclick="toggleSelection(this, 'color', 'رمادي')">رمادي</button>
                                <button type="button" class="variant-select-btn" onclick="toggleSelection(this, 'color', 'بني')">بني</button>
                            </div>
                        </div>
                        <button type="button" onclick="generateVariants()" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px;">توليد التركيبات</button>
                        <div id="generated-variants-list" style="display: grid; gap: 10px;"></div>
                    </div>
                    <button type="submit" class="submit-btn">إضافة المنتج للمتجر</button>
                </form>
            </div>

            <!-- جدول المنتجات -->
            <div class="table-container">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>اسم المنتج</th>
                            <th>السعر</th>
                            <th>المخزون</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="products.js"></script>
</body>
</html>
